<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Watch Time Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>YouTube Watch Time Tracker</h1>
    <p class="label">Today</p>
    <p id="today-total">0m</p>

    <div class="danger-zone">
      <button id="delete-btn" type="button" class="danger">
        Delete all data
      </button>
      <div id="confirm-row" class="confirm-row" hidden>
        <span class="confirm-text">Delete all watch-time data?</span>
        <div class="confirm-actions">
          <button id="confirm-delete-btn" type="button" class="danger">
            Yes, delete
          </button>
          <button id="cancel-delete-btn" type="button">Cancel</button>
        </div>
      </div>
      <p id="delete-status" class="delete-status" role="status" aria-live="polite"></p>
    </div>

    <p id="version"></p>
    <script type="module" src="popup.ts"></script>
  </body>
</html>
